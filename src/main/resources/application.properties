spring.application.name=mj-auth
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/mountain_journey
spring.datasource.username=postgres
spring.datasource.password=Azerty123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

# Disable automatic column name conversion (keeps @Column names as-is)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT
jwt.secret=your_super_secret_key_must_be_at_least_256_bits_long_for_hs256
jwt.expiration=86400000