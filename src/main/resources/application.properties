spring.application.name=mj-auth
server.port=8081

# Connexion locale (hors Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/mountain_journey
spring.datasource.username=mj_user
spring.datasource.password=mj_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable automatic column name conversion (keeps @Column names as-is)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT
jwt.secret=your_super_secret_key_must_be_at_least_256_bits_long_for_hs256
jwt.expiration=86400000