# Render injecte DATABASE_URL au format postgresql://user:pass@host:port/db
# Le script de démarrage Docker transforme DATABASE_URL en SPRING_DATASOURCE_URL avec préfixe jdbc:
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=never

# Le port est injecté par Render via $PORT, géré dans start.sh avec -Dserver.port
# Ne pas fixer server.port ici

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

